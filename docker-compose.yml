services:
  postgres:
    image: postgres:16-alpine
    container_name: hydroponics-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hydroponics
    ports:
      - "5432:5432"
    volumes:
      - hydroponics_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hydroponics"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hydroponics-api
    ports:
      - "8000:8000"
    # Loads GROQ_API_KEY (and other secrets) from backend/.env. DATABASE_URL below overrides DB host for Docker network.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hydroponics
      MQTT_HOST: "193fbce2f2fb461db5e5fea6c8257502.s1.eu.hivemq.cloud"
      MQTT_PORT: "8883"
      MQTT_USERNAME: "esp32user"
      MQTT_PASSWORD: "Esp32air"
      MQTT_TOPIC: "sensors/air_quality"
      MQTT_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hydroponics_pg_data:
