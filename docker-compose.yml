version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hydroponics-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hydroponics
    ports:
      - "5432:5432"
    volumes:
      - hydroponics_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hydroponics"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hydroponics_pg_data:

